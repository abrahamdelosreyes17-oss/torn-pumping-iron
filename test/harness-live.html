    clearInterval(t);
    if (_store['pumpingIron.v1.planNow']) return;
    // &follow=steady: then follow that one of the saved plans (as picking a row on Plan does).
    window.__pi.createPlan({ months: Number(Q.get('plan')) || 1 }).then(() => { if (Q.get('follow')) window.__pi.followStrategy(Q.get('follow')); });
  }, 50);
}
setTimeout(() => {
  const out = document.getElementById('out');
  if (out.textContent.startsWith('BOOT ERROR')) return;
  const m = window.__pi && window.__pi.model();
  const clock = (t) => new Date(t).toISOString().slice(11, 16);
  const summary = m && m.ready ? {
    next: m.next && { at: clock(m.next.at), label: m.next.label, trains: m.next.trains, gain: m.next.gain },
    steps: m.steps.map((s) => clock(s.at) + ' ' + s.label + ' ' + JSON.stringify(s.trains) + ' +' + s.gain),
    strip: { energy: m.strip.energy.current + '/' + m.strip.energy.max, happy: m.strip.happy.current, property: m.strip.happy.property, drugLeftS: Math.round(m.strip.drug.left / 1000), refillFree: m.strip.refill.free },
    buyToday: m.buyToday,
    heads: m.heads,
    recommended: m.recommendation && m.recommendation.recommended,
    plannedGain: m.plannedGain,
    reachedDay: m.reachedDay,
  } : m;
  out.textContent = JSON.stringify({ booted: document.documentElement.getAttribute('data-pi-booted'), menus: window.__menus, model: summary, lastError: JSON.parse(_store['pumpingIron.v1.lastError'] || 'null'), keyDead: _store['pumpingIron.v1.apiKeyDead'] || null, calls: Q.get('calls') ? window.__calls : window.__calls.length }, null, 1);
}, Number(Q.get('wait') || 3500));
</script>
