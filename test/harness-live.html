<!doctype html><html><head><meta charset="utf-8"><title>Pumping Iron live harness</title></head>
<body style="background:#141618;color:#e3e5e8;font:13px Arial;margin:0">
<pre id="out" style="padding:12px;white-space:pre-wrap">running...</pre>
<script>
/*
 * Boots the real built script with Tampermonkey stubs and canned answers
 * for every service (never the network). The friend's account: 118k STR,
 * Private Island, Gun Shop, 20 energy, Xanax cooldown ending in 3:52.
 *
 * Parameters:
 *   ?key=1        save a Torn key (Limited)
 *   &page=gym     stand in for a Torn page (gym, items, itemmarket, bazaar, points, profile, faction, attack)
 *   &pi=app       boot the webpage instead
 *   &dead=1       Torn answers error 2 (dead key)
 *   &access=1     the state call answers error 16 (a custom key without bars/gym, like FFScouter's)
 *   &drug=0       drug cooldown already over
 *   &calls=1      list every request made in the output
 *   &at=2026-09-29T10:48:00Z   run the page's clock from this Torn time
 *   &fixture=gym-friend   write test/fixtures/<name>.html into the page first (a saved Torn page)
 *   &who=owner    the owner's account (Hank's build: 360M STR, Gym 3000, 1,000 energy)
 *   &build=hank   save this build in the plan
 *   &energy=275   the friend's energy now (default 20)
 *   &win=week     the Buy window (today, three, week)
 *   &hidden=1     the tab reports itself hidden (nothing may be asked)
 *   &trading=MS   a stand-in Torn Trading panel (#ttv2-host) appears after MS ms: Pumping Iron pauses
 *   &ffs=1        save an FFScouter key (canned estimates for the fixture players)
 */
const Q = new URLSearchParams(location.search);
if (Q.get('at')) {
  const realNow = Date.now.bind(Date);
  const shift = Date.parse(Q.get('at')) - realNow();
  Date.now = () => realNow() + shift;
}
const _store = {};
const _listeners = {};
window.GM_getValue = (k, d) => (k in _store ? _store[k] : d);
window.GM_setValue = (k, v) => { const old = _store[k]; _store[k] = v; (_listeners[k] || []).forEach((f) => f(k, old, v, false)); };
window.GM_deleteValue = (k) => { delete _store[k]; };
window.GM_registerMenuCommand = (label) => { (window.__menus = window.__menus || []).push(label); };
window.GM_openInTab = (url) => { (window.__opened = window.__opened || []).push(url); };
window.GM_addValueChangeListener = (k, f) => { (_listeners[k] = _listeners[k] || []).push(f); };
window.__calls = [];

const now = Date.now();
const drug = Q.has('drug') ? Number(Q.get('drug')) : 232;
const OWNER = Q.get('who') === 'owner';
const CANNED = {
  '/v2/user': () => OWNER ? ({
    bars: { energy: { current: 1000, maximum: 150, increment: 5, interval: 600, tick_time: 120, full_time: 0 },
            happy: { current: 5025, maximum: 5025, increment: 5, interval: 900, tick_time: 300, full_time: 0 } },
    cooldowns: { drug, medical: 0, booster: 0 }, refills: { energy: true },
    battlestats: { strength: { value: 360000000 }, defense: { value: 288000000 }, speed: { value: 98400000 }, dexterity: { value: 288000000 }, total: 1034400000 },
    gym: { id: 27, name: 'Gym 3000' },
  }) : ({
    bars: { energy: { current: Number(Q.get('energy') || 20), maximum: 150, increment: 5, interval: 600, tick_time: 120, full_time: 15600 },
            happy: { current: 5100, maximum: 5025, increment: 5, interval: 900, tick_time: 300, full_time: 0 },
            nerve: { current: 40, maximum: 60, increment: 1, interval: 300, tick_time: 12, full_time: 6012 },
            life: { current: 7500, maximum: 7500, increment: 450, interval: 300, tick_time: 90, full_time: 0 }, chain: null },
    cooldowns: { drug, medical: 0, booster: 0 },
    refills: { energy: false, nerve: false, token: false, special_count: 0 },
    battlestats: { strength: { value: 118400, modifier: 0, modifiers: [] }, defense: { value: 96200, modifier: 0, modifiers: [] },
                   speed: { value: 110900, modifier: 0, modifiers: [] }, dexterity: { value: 82700, modifier: 0, modifiers: [] }, total: 408200 },
    gym: { id: 18, name: 'Gun Shop' },
  }),
  '/v2/user/perks': () => ({ perks: { faction: [], job: [], property: ['+ 2% gym gains'], education: ['+ 1% dexterity gym gains'], enhancer: [], book: [], stock: [], merit: [] } }),
  '/v2/user/property': () => ({ property: { id: 1, property: { id: 13, name: 'Private Island' }, happy: 5025 } }),
  '/v2/torn/gyms': () => ({ gyms: [{ id: 18, name: 'Gun Shop', class: 'Middleweight', energy_cost: 10, cost: 10000000, modifiers: { strength: 6.5, speed: 6.4, defense: 6.2, dexterity: 6.2 }, note: null }] }),
  '/v2/torn/calendar': () => ({ calendar: { competitions: [], events: [
    { title: 'CaffeineCon 2026', description: 'Energy drink effects are doubled', start: Math.floor(Date.parse('2026-10-15T00:00:00Z') / 1000), end: Math.floor(Date.parse('2026-10-15T23:59:59Z') / 1000), fixed_start_time: false },
    { title: 'Tourism Day', description: 'Travel capacity doubled', start: Math.floor(Date.parse('2026-09-27T00:00:00Z') / 1000), end: Math.floor(Date.parse('2026-09-27T23:59:59Z') / 1000), fixed_start_time: false },
    { title: 'World Diabetes Day', description: 'Candy effects are tripled', start: Math.floor(Date.parse('2026-10-08T00:00:00Z') / 1000), end: Math.floor(Date.parse('2026-10-08T23:59:59Z') / 1000), fixed_start_time: false },
  ] } }),
  '/v2/user/calendar': () => ({ calendar: { start_time: '12:00 TCT' } }),
  '/v2/user/money': () => ({ money: { points: 45, wallet: 1000000, company: 0, vault: 0, cayman_bank: 0, city_bank: null, faction: null, daily_networth: 0 } }),
  '/v2/user/inventory': (u) => ({ inventory: { items: u.searchParams.get('cat') === 'Drug' ? [{ id: 206, amount: 1, name: 'Xanax' }] : [] } }),
  '/v2/key/info': () => ({ info: { access: { level: 3, type: 'Limited Access' }, user: { id: 2345678 }, selections: {} } }),
  '/v2/market/206/itemmarket': () => ({ itemmarket: { item: { id: 206, name: 'Xanax' }, listings: [{ price: 829500, amount: 3 }, { price: 830000, amount: 1805 }] } }),
  '/v2/market/pointsmarket': () => ({ pointsmarket: [{ id: 91827364, cost: 45120, quantity: 25 }, { id: 91827399, cost: 45150, quantity: 1000 }] }),
  '/api/marketplace/206': () => ({ item_id: 206, listings: [{ player_id: 1234567, player_name: 'Iron_Monk', price: 826500, quantity: 3, last_checked: Math.floor(Date.now() / 1000) - 30 }, { player_id: 2345678, player_name: 'LuckyLefty', price: 828000, quantity: 6, last_checked: Math.floor(Date.now() / 1000) - 45 }] }),
};

// Torn Eye: canned estimates (total stats) and profiles for the fixture players.
const FFS_TOTALS = { 605123: 150e6, 424242: 600e6, 515151: 2.6e9, 3886744: 780e6, 1111: 1e8, 777001: 640e6, 777002: 140e6 };
const NOW_S = Math.floor(Date.now() / 1000);
CANNED['/api/v1/get-stats'] = (u) => (u.searchParams.get('targets') || '').split(',').map((id) => FFS_TOTALS[id] ? { player_id: Number(id), bs_estimate: FFS_TOTALS[id], bs_estimate_human: '', bss_public: null, fair_fight: null, last_updated: NOW_S - 3 * 86400, source: 'bss' } : { player_id: Number(id), bs_estimate: null, last_updated: null });
CANNED['/api/v1/check-key'] = () => ({ is_registered: true, is_premium: false, policy_update_required: false });
CANNED['/api/v1/get-targets'] = () => ({ parameters: {}, targets: Object.entries(FFS_TOTALS).map(([id, t], i) => ({ player_id: Number(id), name: 'Target' + i, level: 50 + i * 3, bs_estimate: t, fair_fight: 2, last_action: NOW_S - (10 + i) * 86400 })) });
CANNED['/v2/faction/7777/members'] = () => ({ members: [
  { id: 424242, name: 'Rival', level: 64, status: { state: 'Okay', until: null, description: 'Okay' } },
  { id: 515151, name: 'Flyer', level: 40, status: { state: 'Traveling', until: null, description: 'Traveling to Mexico' } },
  { id: 777001, name: 'Brix', level: 67, status: { state: 'Hospital', until: NOW_S + 48, description: 'In hospital' } },
  { id: 777002, name: 'Mira_Vex', level: 61, status: { state: 'Hospital', until: NOW_S + 252, description: 'In hospital' } },
] });
CANNED['/v2/user/attacks'] = () => ({ attacks: [] });
// Auto mode: networth a month ago, a week ago and now ($2.4B a month: $80M a day), the money log's categories and lines.
CANNED['/v2/user/personalstats'] = (u) => {
  if (!(u.searchParams.get('stat') || '').includes('networth')) return { personalstats: [] };
  const ts = Number(u.searchParams.get('timestamp')) || NOW_S;
  const nw = 13e9 - Math.round((NOW_S - ts) / 86400) * 80e6;
  return { personalstats: [{ name: 'networth', value: nw }, { name: 'networthwallet', value: 881e6 }, { name: 'networthvault', value: 0 }, { name: 'networthbank', value: 0 }, { name: 'networthcayman', value: 0 }] };
};
CANNED['/v2/torn/logcategories'] = () => ({ logcategories: [{ id: 17, title: 'Bazaars' }, { id: 18, title: 'Item market' }, { id: 5, title: 'Gym' }] });
CANNED['/v2/user/log'] = (u) => ({ log: u.searchParams.get('cat') === '17' ? [{ id: 'a', timestamp: NOW_S - 2 * 86400, details: { id: 1225, title: 'Bazaar sell', category: 'Bazaars' }, data: { money: 150e6 }, params: {} }] : [] });
CANNED['/v2/user/equipment'] = () => ({ equipment: [{ type: 'Weapon', sub_type: 'Primary', name: 'Minigun', stats: { damage: 71.2, accuracy: 51 }, bonuses: [] }], clothing: [] });
const profileOf = (id) => ({ profile: { id: Number(id), name: 'P' + id, level: 60, rank: 'Supreme Hitman', life: { current: 7300, maximum: 7300 }, status: { state: 'Okay', description: 'Okay' } } });

window.GM_xmlhttpRequest = (o) => {
  const u = new URL(o.url);
  window.__calls.push(u.hostname + u.pathname + (u.searchParams.get('selections') ? '?selections=' + u.searchParams.get('selections') : '') + (u.searchParams.get('cat') ? '?cat=' + u.searchParams.get('cat') : ''));
  setTimeout(() => {
    let body;
    if (Q.get('dead') && u.hostname === 'api.torn.com') body = { error: { code: 2, error: 'Incorrect key' } };
    else if (Q.get('access') && u.pathname === '/v2/user' && u.searchParams.get('selections')) body = { error: { code: 16, error: 'Access level of this key is not high enough' } };
    else if (Q.get('access') && u.pathname === '/v2/key/info') body = { info: { access: { level: 0, type: 'Custom' }, user: { id: 2345678 }, selections: { user: ['profile', 'basic', 'cooldowns', 'refills', 'attacks', 'battlestats', 'personalstats'] } } };
    else if (u.pathname === '/v2/key/info' && u.searchParams.get('key') === 'FullKeyHarness12') body = { info: { access: { level: 4, type: 'Full Access' }, user: { id: 2345678 }, selections: {} } };
    else if (/^\/v2\/user\/\d+\/profile$/.test(u.pathname)) body = profileOf(u.pathname.split('/')[3]);
    else body = (CANNED[u.pathname] || (() => ({})))(u);
    o.onload({ status: 200, responseText: JSON.stringify(body) });
  }, 20);
};
if (Q.get('key')) _store['pumpingIron.v1.apiKey'] = JSON.stringify('HarnessKey123456');
if (Q.get('ffs')) _store['pumpingIron.v1.ffsKey'] = JSON.stringify('FfsKeyHarness123');
if (Q.get('full')) { _store['pumpingIron.v1.fullKey'] = JSON.stringify('FullKeyHarness12'); _store['pumpingIron.v1.fullKeyState'] = JSON.stringify({ ok: true, at: 1 }); }
if (Q.get('win')) _store['pumpingIron.v1.settings'] = JSON.stringify({ buyWindow: Q.get('win') });
if (Q.get('hidden')) Object.defineProperty(document, 'visibilityState', { get: () => 'hidden' });
if (Q.get('build')) _store['pumpingIron.v1.plan'] = JSON.stringify({ type: 'steady', strategy: 'steady', build: Q.get('build'), goal: null, createdAt: 1 });
if (Q.get('fixture')) {
  const x = new XMLHttpRequest();
  x.open('GET', 'fixtures/' + Q.get('fixture').replace(/[^a-z-]/g, '') + '.html', false);
  x.send();
  document.write(x.responseText);
}
if (Q.get('trading')) setTimeout(() => { const d = document.createElement('div'); d.id = 'ttv2-host'; d.style.cssText = 'position:fixed;right:16px;bottom:16px;width:300px;height:300px;background:#2e2e2e'; document.body.appendChild(d); }, Number(Q.get('trading')) || 0);
window.onerror = (m) => { document.getElementById('out').textContent = 'BOOT ERROR: ' + m; };
</script>
<script>document.write('<script src="../torn-pumping-iron.user.js?v=' + Date.now() + '"><\/script>');</script>
<script>
setTimeout(() => {
  const out = document.getElementById('out');
  if (out.textContent.startsWith('BOOT ERROR')) return;
  const m = window.__pi && window.__pi.model();
  const clock = (t) => new Date(t).toISOString().slice(11, 16);
  const summary = m && m.ready ? {
    next: m.next && { at: clock(m.next.at), label: m.next.label, trains: m.next.trains, gain: m.next.gain },
    steps: m.steps.map((s) => clock(s.at) + ' ' + s.label + ' ' + JSON.stringify(s.trains) + ' +' + s.gain),
    strip: { energy: m.strip.energy.current + '/' + m.strip.energy.max, happy: m.strip.happy.current, property: m.strip.happy.property, drugLeftS: Math.round(m.strip.drug.left / 1000), refillFree: m.strip.refill.free },
    buyToday: m.buyToday,
    heads: m.heads,
    recommended: m.recommendation && m.recommendation.recommended,
    plannedGain: m.plannedGain,
    reachedDay: m.reachedDay,
  } : m;
  out.textContent = JSON.stringify({ booted: document.documentElement.getAttribute('data-pi-booted'), menus: window.__menus, model: summary, lastError: JSON.parse(_store['pumpingIron.v1.lastError'] || 'null'), keyDead: _store['pumpingIron.v1.apiKeyDead'] || null, calls: Q.get('calls') ? window.__calls : window.__calls.length }, null, 1);
}, Number(Q.get('wait') || 3500));
</script>
</body></html>
