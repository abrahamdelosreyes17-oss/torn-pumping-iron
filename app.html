<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pumping Iron</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #141618; color: #e3e5e8; font: 13px/1.5 Arial, Helvetica, sans-serif;
  }
  main { max-width: 440px; padding: 24px; text-align: center; }
  .mark { width: 34px; height: 34px; margin: 0 auto 14px; border-radius: 50%; background: #efebe2;
    display: grid; place-items: center; box-shadow: inset 0 0 0 5px #efebe2, inset 0 0 0 7px #2a2d31; }
  .mark i { width: 8px; height: 8px; border-radius: 50%; background: #15171a; }
  h1 { margin: 0 0 8px; font-size: 20px; color: #fff; letter-spacing: .5px; text-transform: uppercase; }
  p { margin: 0 0 8px; color: #939aa1; }
  a { color: #8fb8e8; }
</style>
</head>
<body>
<!--
  The Torn Pumping Iron userscript draws its page over this one. Without the
  script, this is all there is: nothing here talks to Torn or anyone else.
-->
<main>
  <div class="mark"><i></i></div>
  <h1>Pumping Iron</h1>
  <p>This page opens with the Torn Pumping Iron script in Tampermonkey.</p>
  <p>If you see this, the script is not installed, or not up to date.</p>
</main>
</body>
</html>
